name: Проверка проекта Godot
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Проверить импорт и синтаксис
        run: godot --headless --editor --path . --quit
      - name: Проверить запуск сцены
        run: timeout 20s godot --headless --path . --quit-after 5
