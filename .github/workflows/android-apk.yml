name: Сборка Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Экспорт APK (Godot 4.3)
    runs-on: ubuntu-22.04
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Установить компоненты Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Установить Godot и Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Настроить пути Android SDK и Java для Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          mkdir -p build

      - name: Импортировать ресурсы Godot
        run: godot --headless --editor --path . --quit

      - name: Собрать отладочный APK (ARM64)
        run: godot --headless --path . --export-debug "Android" build/posledniy-rubezh-debug.apk

      - name: Проверить APK
        run: |
          test -s build/posledniy-rubezh-debug.apk
          file build/posledniy-rubezh-debug.apk
          ls -lh build/posledniy-rubezh-debug.apk

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: posledniy-rubezh-android-debug
          path: build/posledniy-rubezh-debug.apk
          if-no-files-found: error
          retention-days: 30
